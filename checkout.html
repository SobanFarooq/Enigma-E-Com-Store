<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | ENIGMA</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- NAVBAR -->

<nav class="navbar navbar-dark bg-dark py-3">
    <div class="container justify-content-center">

        <a class="navbar-brand" href="index.html">
            ENIGMA
        </a>

    </div>
</nav>

<!-- CHECKOUT -->

<div class="container py-5">

    <div class="row g-5">

        <!-- ORDER SUMMARY -->

        <div class="col-lg-4 order-lg-last">

            <h3 class="mb-4">
                Order Summary
            </h3>

            <div id="checkout-items"></div>

            <hr>

            <div class="d-flex justify-content-between">

                <strong>Total</strong>

                <strong id="checkout-total">
                    $0.00
                </strong>

            </div>

        </div>

        <!-- FORM -->

        <div class="col-lg-8">

            <h3 class="mb-4">
                Billing Details
            </h3>

            <form id="checkout-form">

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label>First Name</label>

                        <input
                            type="text"
                            class="form-control"
                            required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label>Last Name</label>

                        <input
                            type="text"
                            class="form-control"
                            required>

                    </div>

                </div>

                <div class="mb-3">

                    <label>Email</label>

                    <input
                        type="email"
                        class="form-control"
                        required>

                </div>

                <div class="mb-3">

                    <label>Address</label>

                    <input
                        type="text"
                        class="form-control"
                        required>

                </div>

                <div class="mb-3">

                    <label>Card Number</label>

                    <input
                        type="text"
                        class="form-control"
                        required>

                </div>

                <button
                    type="submit"
                    class="btn btn-dark w-100 mt-3">

                    Place Order

                </button>

            </form>

        </div>

    </div>

</div>

<!-- SUCCESS MODAL -->

<div class="modal fade" id="successModal">

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">
                    Order Confirmed
                </h5>

            </div>

            <div class="modal-body">

                Thank you for shopping with ENIGMA.

            </div>

            <div class="modal-footer">

                <a
                    href="index.html"
                    class="btn btn-dark">

                    Return Home

                </a>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>

const cart =
    JSON.parse(
        localStorage.getItem("cart")
    ) || [];

const itemsContainer =
    document.getElementById(
        "checkout-items"
    );

const totalElement =
    document.getElementById(
        "checkout-total"
    );

let total = 0;

cart.forEach(item => {

    total +=
        item.price * item.quantity;

    itemsContainer.innerHTML += `
        <div class="mb-3 border-bottom pb-2">

            <h6>${item.name}</h6>

            <small>
                Quantity: ${item.quantity}
            </small>

            <p>
                $${item.price}
            </p>

        </div>
    `;
});

totalElement.textContent =
    "$" + total.toFixed(2);

document
    .getElementById("checkout-form")
    .addEventListener(
        "submit",
        function(event) {

            event.preventDefault();

            localStorage.removeItem(
                "cart"
            );

            const modal =
                new bootstrap.Modal(
                    document.getElementById(
                        "successModal"
                    )
                );

            modal.show();

        }
    );

</script>

</body>
</html>
